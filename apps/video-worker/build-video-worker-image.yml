# Builds the video worker container image in Azure Container Registry and pushes it there.
#
# The image is built by ACR Tasks (`az acr build`), so the agent needs the Azure
# CLI but not Docker. The bundled worker (apps/video-worker/deploy/dist) must
# already exist, either built in the same job or downloaded from the build
# stage's artifact into `workingDirectory`.
#
# Wired into the deployment stage with the Container Apps infrastructure
# (ADR 0035), once the container registry exists.
parameters:
- name: ServiceConnectionName
  type: string
- name: containerRegistryName
  displayName: 'Azure Container Registry name (without .azurecr.io)'
  type: string
- name: imageRepository
  type: string
  default: video-worker
- name: imageTag
  type: string
  default: $(Build.BuildId)
- name: workingDirectory
  displayName: 'Directory containing the Dockerfile, .dockerignore, and deploy/dist'
  type: string
  default: apps/video-worker

steps:
- task: AzureCLI@2
  displayName: 'Image: build and push ${{parameters.imageRepository}}:${{parameters.imageTag}}'
  inputs:
    azureSubscription: ${{parameters.ServiceConnectionName}}
    scriptType: bash
    scriptLocation: inlineScript
    workingDirectory: ${{parameters.workingDirectory}}
    inlineScript: |
      set -euo pipefail
      test -f deploy/dist/index.mjs || { echo "##vso[task.logissue type=error]deploy/dist/index.mjs not found. Build @apps/video-worker first."; exit 1; }
      az acr build \
        --registry '${{parameters.containerRegistryName}}' \
        --platform linux/amd64 \
        --image '${{parameters.imageRepository}}:${{parameters.imageTag}}' \
        --image '${{parameters.imageRepository}}:latest' \
        .
