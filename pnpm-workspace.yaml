auditConfig:
  ignoreGhsas:
    - GHSA-6rw7-vpxm-498p
    - GHSA-2w69-qvjg-hvjx
    - GHSA-8v8x-cx79-35w7
    - GHSA-wpg9-53fq-2r8h
    - GHSA-q7rr-3cgh-j5r3
    - GHSA-869p-cjfg-cm3x # jws@4.0.0: Improperly Verifies HMAC Signature (transitive from azurite)
    - GHSA-qwww-vcr4-c8h2 # react-router 7.x: defer upgrade until the react-router-dom v8 migration is completed

allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true
  mongodb-memory-server: true
  redis-memory-server: true
  protobufjs: true
  snyk: true

