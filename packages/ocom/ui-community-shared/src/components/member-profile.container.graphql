query SharedMemberProfileContainerMember($id: ObjectID!) {
	member(id: $id) {
		...SharedMemberProfileContainerMemberFields
	}
}

query SharedMemberProfileContainerMemberSelfProfile($communityId: ID!) {
	memberMyProfile(communityId: $communityId) {
		...SharedMemberProfileContainerMemberFields
	}
}

mutation SharedMemberProfileContainerMemberUpdateProfile($input: MemberUpdateProfileInput!) {
	memberUpdateProfile(input: $input) {
		status {
			success
			errorMessage
		}
		member {
			...SharedMemberProfileContainerMemberFields
		}
	}
}

mutation SharedMemberProfileContainerMemberUpdateMyProfile($communityId: ID!, $input: UpdateMyMemberProfileInput!) {
	memberUpdateMyProfile(communityId: $communityId, input: $input) {
		status {
			success
			errorMessage
		}
		member {
			...SharedMemberProfileContainerMemberFields
		}
	}
}

fragment SharedMemberProfileContainerMemberFields on Member {
	id
	memberName
	profile {
		name
		email
		bio
		showInterests
		showEmail
		showProfile
		showLocation
		showProperties
	}
	createdAt
	updatedAt
}
