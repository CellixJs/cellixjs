mutation AdminPropertiesCreateContainerPropertyCreate($input: PropertyCreateInput!) {
	propertyCreate(input: $input) {
		status {
			success
			errorMessage
		}
		property {
			...AdminPropertiesCreateContainerPropertyFields
		}
	}
}

# Minimal owner-options lookup shared by the property create and detail
# screens: property managers only need id + name to build the owner dropdown,
# so this avoids fetching member-management data (accounts, profile email/bio)
# that the fuller members operation selects.
query AdminPropertiesOwnerOptions($communityId: ObjectID!) {
	membersByCommunityId(communityId: $communityId) {
		id
		memberName
	}
}

fragment AdminPropertiesCreateContainerPropertyFields on Property {
	id
	propertyName
	createdAt
	updatedAt
}
