query AdminVideosDetailContainerVideo($id: ObjectID!) {
	videoById(id: $id) {
		...AdminVideosDetailContainerVideoFields
	}
}

query AdminVideosDetailContainerPlayback($id: ObjectID!) {
	videoPlayback(id: $id) {
		hlsManifestUrl
		dashManifestUrl
		captionTracks {
			language
			label
			kind
			url
		}
		sasToken
		expiresAt
	}
}

fragment AdminVideosDetailContainerVideoFields on Video {
	id
	title
	status
	durationSeconds
	renditionHeights
	failureMessage
	createdAt
	canManage
	captionTracks {
		language
		label
		kind
	}
}

mutation AdminVideosDetailContainerRemoveCaption($input: VideoRemoveCaptionInput!) {
	videoRemoveCaption(input: $input) {
		status {
			success
			errorMessage
		}
		video {
			...AdminVideosDetailContainerVideoFields
		}
	}
}

query AdminVideosDetailContainerViewings($id: ObjectID!) {
	videoById(id: $id) {
		id
		myViewing {
			...AdminVideosDetailContainerViewingFields
		}
		viewings {
			...AdminVideosDetailContainerViewingFields
			memberId
			member {
				id
				memberName
			}
		}
	}
}

fragment AdminVideosDetailContainerViewingFields on VideoViewing {
	id
	durationSeconds
	coverage
	lastPositionSeconds
	completedAt
	updatedAt
	unwatched {
		start
		end
	}
}

mutation AdminVideosDetailContainerRecordProgress($input: VideoRecordProgressInput!) {
	videoRecordProgress(input: $input) {
		status {
			success
			errorMessage
		}
		viewing {
			...AdminVideosDetailContainerViewingFields
		}
	}
}
