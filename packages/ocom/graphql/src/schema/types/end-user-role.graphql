type EndUserRole implements MongoBase {
	roleName: String!
	community: Community!
	isDefault: Boolean!
	roleType: String
	permissions: EndUserRolePermissions!

	id: ObjectID!
	schemaVersion: String
	createdAt: DateTime
	updatedAt: DateTime
}

type EndUserRolePermissions {
	propertyPermissions: EndUserRolePropertyPermissions!
	# True when the role grants admin access through any non-property
	# permission (the backend member `isAdmin` derivation with
	# `canManageProperties` excluded). Lets clients distinguish full admins
	# from property-only managers without exposing every permission group.
	isNonPropertyAdmin: Boolean!
}

type EndUserRolePropertyPermissions {
	canManageProperties: Boolean!
	canEditOwnProperty: Boolean!
}

extend type Query {
	# Get all roles for a community
	endUserRolesByCommunityId(communityId: ObjectID!): [EndUserRole!]!

	# Get a specific role by ID
	endUserRole(id: ObjectID!): EndUserRole
}
