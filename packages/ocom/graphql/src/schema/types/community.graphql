type Community implements MongoBase {
	name: String!
	domain: String
	#   domainStatus: CommunityDomainResult
	whiteLabelDomain: String
	handle: String
	publicContentBlobUrl: String
	createdBy: EndUser!
	finance: CommunityFinance
	paymentInstrument: CommunityPaymentInstrumentDisplay
	#   roles: [Role]
	#   files: [FileInfo]
	#   filesByType(type: String!): [FileInfo]
	#   userIsAdmin: Boolean!

	id: ObjectID!
	schemaVersion: String!
	createdAt: DateTime!
	updatedAt: DateTime!
}

type CommunityFinance {
	subscriptionTier: String
	paymentInstrumentId: String
	transactions: [CommunityTransaction!]
}

type CommunityTransaction implements MongoSubdocument {
	"""
	Charged amount in minor currency units (for example cents for USD).
	"""
	amount: Int
	transactionReference: CommunityTransactionReference

	id: ObjectID!
	createdAt: DateTime
	updatedAt: DateTime
}

type CommunityTransactionReference {
	vendor: String
	isSuccess: Boolean
	lastRequestedAt: DateTime
	referenceId: String
	transactionId: String
	reconciliationId: String
	completedAt: DateTime
	errorOccurredAt: DateTime
	errorCode: String
	errorMessage: String
}

type CommunityPaymentInstrumentDisplay {
	maskedCardNumber: String
	brand: String
	expirationMonth: String
	expirationYear: String
}

type CommunitySubscription {
	tier: String!
	"""
	Price for a single member in minor currency units (for example cents for USD).
	"""
	pricePerMember: Int!
	"""
	ISO 4217 currency code the amounts are expressed in.
	"""
	currency: String!
	memberCount: Int!
	"""
	memberCount * pricePerMember, in minor currency units.
	"""
	amount: Int!
}

extend type Query {
	currentCommunity: Community
	communityById(id: ObjectID!): Community
	communitiesForCurrentEndUser: [Community]
	communitySubscription(communityId: ObjectID!): CommunitySubscription
}

extend type Mutation {
	communityCreate(input: CommunityCreateInput!): CommunityMutationResult!
	communityUpdateSettings(input: CommunityUpdateSettingsInput!): CommunityMutationResult!
	communityUpdateSubscriptionTier(input: CommunityUpdateSubscriptionTierInput!): CommunityMutationResult!
	communityUpdatePaymentInstrument(input: CommunityUpdatePaymentInstrumentInput!): CommunityMutationResult!
	communityProcessSubscriptionCharge(input: CommunityProcessSubscriptionChargeInput!): CommunityMutationResult!
}

type CommunityMutationResult implements MutationResult {
	status: MutationStatus!
	community: Community
}

input CommunityCreateInput {
	name: String!
	subscriptionTier: String
	paymentInstrument: CommunityPaymentInstrumentInput
}

input CommunityPaymentInstrumentInput {
	paymentToken: String
	billingName: String
	billingEmail: String
	billingAddress: String
	billingCity: String
	billingState: String
	billingPostalCode: String
	billingCountry: String
}

input CommunityUpdateSettingsInput {
	id: ObjectID!
	name: String
	domain: String
	whiteLabelDomain: String
	handle: String
}

input CommunityUpdateSubscriptionTierInput {
	communityId: ObjectID!
	subscriptionTier: String!
}

input CommunityUpdatePaymentInstrumentInput {
	communityId: ObjectID!
	paymentInstrument: CommunityPaymentInstrumentInput!
}

input CommunityProcessSubscriptionChargeInput {
	communityId: ObjectID!
	"""
	Identifies one logical charge; repeating it returns the recorded result instead of billing again.
	"""
	idempotencyKey: String
}
