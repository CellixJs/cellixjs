type Property implements MongoBase {
	propertyName: String!
	propertyType: String
	listedForSale: Boolean!
	listedForRent: Boolean!
	listedForLease: Boolean!
	listedInDirectory: Boolean!
	community: Community!
	owner: Member
	location: PropertyLocation
	listingDetail: PropertyListingDetail
	tags: [String!]

	id: ObjectID!
	schemaVersion: String
	createdAt: DateTime
	updatedAt: DateTime
}

type PropertyLocation {
	address: PropertyAddress
}

type PropertyAddress {
	streetNumber: String
	streetName: String
	municipality: String
	countrySubdivision: String
	postalCode: String
	country: String
}

type PropertyListingDetail {
	price: Float
	rentHigh: Float
	rentLow: Float
	lease: Float
	maxGuests: Float
	bedrooms: Float
	bathrooms: Float
	squareFeet: Float
	yearBuilt: Float
	lotSize: Float
	description: String
	amenities: [String!]
	bedroomDetails: [PropertyBedroomDetail!]
	additionalAmenities: [PropertyAdditionalAmenity!]
	images: [String!]
	video: String
	floorPlan: String
	floorPlanImages: [String!]
	listingAgent: String
	listingAgentPhone: String
	listingAgentEmail: String
	listingAgentWebsite: String
	listingAgentCompany: String
	listingAgentCompanyPhone: String
	listingAgentCompanyEmail: String
	listingAgentCompanyWebsite: String
	listingAgentCompanyAddress: String
}

type PropertyBedroomDetail {
	id: ObjectID!
	roomName: String
	bedDescriptions: [String!]
}

type PropertyAdditionalAmenity {
	id: ObjectID!
	category: String
	amenities: [String!]
}

input PropertyCreateInput {
	propertyName: String!
	propertyType: String
	ownerId: ObjectID
	listedForSale: Boolean
	listedForRent: Boolean
	listedForLease: Boolean
	listedInDirectory: Boolean
	tags: [String!]
	location: PropertyLocationInput
	listingDetail: PropertyListingDetailInput
}

input PropertyUpdateInput {
	id: ObjectID!
	propertyName: String
	propertyType: String
	ownerId: ObjectID
	listedForSale: Boolean
	listedForRent: Boolean
	listedForLease: Boolean
	listedInDirectory: Boolean
	tags: [String!]
	location: PropertyLocationInput
	listingDetail: PropertyListingDetailInput
}

input PropertyLocationInput {
	address: PropertyAddressInput
}

input PropertyAddressInput {
	streetNumber: String
	streetName: String
	municipality: String
	countrySubdivision: String
	postalCode: String
	country: String
}

input PropertyListingDetailInput {
	price: Float
	rentHigh: Float
	rentLow: Float
	lease: Float
	maxGuests: Float
	bedrooms: Float
	bathrooms: Float
	squareFeet: Float
	yearBuilt: Float
	lotSize: Float
	description: String
	amenities: [String!]
	bedroomDetails: [PropertyBedroomDetailInput!]
	additionalAmenities: [PropertyAdditionalAmenityInput!]
	images: [String!]
	video: String
	floorPlan: String
	floorPlanImages: [String!]
	listingAgent: String
	listingAgentPhone: String
	listingAgentEmail: String
	listingAgentWebsite: String
	listingAgentCompany: String
	listingAgentCompanyPhone: String
	listingAgentCompanyEmail: String
	listingAgentCompanyWebsite: String
	listingAgentCompanyAddress: String
}

input PropertyBedroomDetailInput {
	roomName: String
	bedDescriptions: [String!]
}

input PropertyAdditionalAmenityInput {
	category: String
	amenities: [String!]
}

input PropertyDeleteInput {
	id: ObjectID!
}

type PropertyMutationResult implements MutationResult {
	status: MutationStatus!
	property: Property
}

extend type Query {
	property(id: ObjectID!): Property
	propertiesByCommunityId(communityId: ObjectID!): [Property!]!
}

extend type Mutation {
	propertyCreate(input: PropertyCreateInput!): PropertyMutationResult!
	propertyUpdate(input: PropertyUpdateInput!): PropertyMutationResult!
	propertyDelete(input: PropertyDeleteInput!): PropertyMutationResult!
}
