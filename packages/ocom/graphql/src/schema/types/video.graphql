type Video implements MongoBase {
	title: String!
	status: VideoStatus!
	sourceContentType: String!
	sourceSizeBytes: SafeInt!
	durationSeconds: Float
	renditionHeights: [Int!]!
	failureCode: String
	failureMessage: String
	communityId: ObjectID!
	"The community's name, when loaded (staff encoding lists)."
	communityName: String
	"Caption files attached by community admins, one per language."
	captionTracks: [VideoCaptionTrack!]!

	id: ObjectID!
	schemaVersion: String!
	createdAt: DateTime!
	updatedAt: DateTime!
}

"A request header the browser sends with a signed upload."
type HttpHeader {
	name: String!
	value: String!
}

"""
A signed request for uploading a video original directly to storage: PUT the
file to url with these headers. The browser sets Content-Length itself, and the
upload must start within about 15 minutes.
"""
type VideoUploadTarget {
	url: String!
	headers: [HttpHeader!]!
}

"""
What a player needs to stream a ready video. Append sasToken to every manifest
and segment request; it expires at expiresAt.
"""
type VideoPlayback {
	dashManifestUrl: String!
	hlsManifestUrl: String!
	"Attached caption files (WebVTT). Append sasToken to each url too."
	captionTracks: [VideoPlaybackCaptionTrack!]!
	sasToken: String!
	expiresAt: DateTime!
}

"CAPTIONS describe speech and meaningful sounds; SUBTITLES translate dialogue only."
enum VideoCaptionKind {
	CAPTIONS
	SUBTITLES
}

"A caption file attached to a video."
type VideoCaptionTrack {
	"BCP 47 language tag, such as en or es-MX."
	language: String!
	"Name shown in the player's captions menu."
	label: String!
	kind: VideoCaptionKind!
}

type VideoPlaybackCaptionTrack {
	language: String!
	label: String!
	kind: VideoCaptionKind!
	"WebVTT file URL."
	url: String!
}

"""
What the staff encoder needs to encode a video: a read link for the original
(valid for 6 hours) and where to write the output.
"""
type VideoEncodingStart {
	sourceUrl: String!
	outputContainerName: String!
	outputPrefix: String!
}

"A write link for one encoded file: PUT it to url with the header x-ms-blob-type: BlockBlob."
type VideoOutputUpload {
	path: String!
	url: String!
}

enum VideoStatus {
	AWAITING_UPLOAD
	UPLOADED
	ENCODING
	READY
	FAILED
}

input VideoRequestUploadInput {
	title: String!
	contentType: String!
	sizeBytes: SafeInt!
}

input VideoCompleteUploadInput {
	id: ObjectID!
}

"""
Attaches a caption file, replacing any track in the same language. content is
the text of a WebVTT (.vtt) or SubRip (.srt) file, up to 1 MB; it is stored as
WebVTT.
"""
input VideoAttachCaptionInput {
	id: ObjectID!
	language: String!
	label: String!
	kind: VideoCaptionKind!
	content: String!
}

input VideoRemoveCaptionInput {
	id: ObjectID!
	language: String!
}

input VideoStartEncodingInput {
	id: ObjectID!
}

input VideoRequestOutputUploadsInput {
	id: ObjectID!
	"Output file paths relative to the video's output prefix, for example video/720/1.m4s."
	paths: [String!]!
}

input VideoEncodingSuccessInput {
	"Paths of the manifests relative to the output prefix."
	dashManifestPath: String!
	hlsManifestPath: String!
	durationSeconds: Float!
	renditionHeights: [Int!]!
}

input VideoEncodingFailureInput {
	code: String!
	message: String!
}

"Provide exactly one of succeeded or failed."
input VideoRecordEncodingResultInput {
	id: ObjectID!
	succeeded: VideoEncodingSuccessInput
	failed: VideoEncodingFailureInput
}

type VideoMutationResult implements MutationResult {
	status: MutationStatus!
	video: Video
}

type VideoStartEncodingMutationResult implements MutationResult {
	status: MutationStatus!
	video: Video
	encoding: VideoEncodingStart
}

type VideoRequestOutputUploadsMutationResult implements MutationResult {
	status: MutationStatus!
	uploads: [VideoOutputUpload!]
}

type VideoRequestUploadMutationResult implements MutationResult {
	status: MutationStatus!
	video: Video
	upload: VideoUploadTarget
}

extend type Query {
	"Videos in the current community, newest first."
	communityVideos: [Video!]!
	"A video in the current community."
	videoById(id: ObjectID!): Video
	"Streaming URLs and a read token for a ready video in the current community."
	videoPlayback(id: ObjectID!): VideoPlayback
	"Staff: videos the caller can encode now, across all communities, oldest first."
	videosAwaitingEncoding: [Video!]!
}

extend type Mutation {
	"Creates a video in the current community and returns a signed upload for its original."
	videoRequestUpload(input: VideoRequestUploadInput!): VideoRequestUploadMutationResult!
	"Confirms the original was uploaded, so staff can encode it."
	videoCompleteUpload(input: VideoCompleteUploadInput!): VideoMutationResult!
	"Attaches a caption file to a video in the current community."
	videoAttachCaption(input: VideoAttachCaptionInput!): VideoMutationResult!
	"Removes a caption track from a video in the current community."
	videoRemoveCaption(input: VideoRemoveCaptionInput!): VideoMutationResult!
	"Staff: marks a video encoding and returns a read link for the original and the output destination."
	videoStartEncoding(input: VideoStartEncodingInput!): VideoStartEncodingMutationResult!
	"Staff: write links for encoded output files."
	videoRequestOutputUploads(input: VideoRequestOutputUploadsInput!): VideoRequestOutputUploadsMutationResult!
	"Staff: records a successful or failed encode."
	videoRecordEncodingResult(input: VideoRecordEncodingResultInput!): VideoMutationResult!
}
