query MemberPropertyDetail($id: ObjectID!) {
	property(id: $id) {
		...MemberPropertyDetailFields
	}
}

mutation MemberPropertyUpdate($input: PropertyUpdateInput!) {
	propertyUpdate(input: $input) {
		status {
			success
			errorMessage
		}
		property {
			...MemberPropertyDetailFields
		}
	}
}

fragment MemberPropertyDetailFields on Property {
	id
	propertyName
	propertyType
	listedForSale
	listedForRent
	listedForLease
	listedInDirectory
	tags
	owner {
		id
	}
	location {
		address {
			streetNumber
			streetName
			municipality
			countrySubdivision
			postalCode
			country
		}
	}
	listingDetail {
		price
		rentHigh
		rentLow
		lease
		maxGuests
		bedrooms
		bathrooms
		squareFeet
		yearBuilt
		lotSize
		description
		amenities
		bedroomDetails {
			id
			roomName
			bedDescriptions
		}
		additionalAmenities {
			id
			category
			amenities
		}
		images
		video
		floorPlan
		floorPlanImages
		listingAgent
		listingAgentPhone
		listingAgentEmail
		listingAgentWebsite
		listingAgentCompany
		listingAgentCompanyPhone
		listingAgentCompanyEmail
		listingAgentCompanyWebsite
		listingAgentCompanyAddress
	}
	createdAt
	updatedAt
}
